    header_verified:
      dimensions: [86, 86, 51]
      volumes: 260
      repetition_time_seconds: 1.7
      run_duration_seconds: 442.0
    analysis:
      level: first-level
      type: full
    preprocessing:
      motion_correction: MCFLIRT
      brain_extraction: BET
      spatial_smoothing_fwhm_mm: 5
      intensity_normalization: false
      highpass_filter: true
      highpass_filter_cutoff_seconds: 60
      lowpass_filter: false
      slice_timing: regular_down
    registration:
      main_structural_image: structural_brain
      functional_to_structural:
        search: normal
        method: BBR
      structural_to_standard:
        standard_image: $FSLDIR/data/standard/MNI152_T1_2mm_brain
        search: normal
        degrees_of_freedom: 12
        nonlinear: false
    statistics:
      prewhitening: true
      evs:
        - name: Left
          timing_file: /home/jovyan/Voxelwise-Walkthroughs/data/ds005085/sub-10015/func/_guess_allLeftButton.txt
          format: custom_3_column
          convolution: double_gamma
          temporal_derivative: false
          temporal_filtering: true
          events: 28
          max_event_end_seconds: 408.667
        - name: Right
          timing_file: /home/jovyan/Voxelwise-Walkthroughs/data/ds005085/sub-10015/func/_guess_allRightButton.txt
          format: custom_3_column
          convolution: double_gamma
          temporal_derivative: false
          temporal_filtering: true
          events: 25
          max_event_end_seconds: 396.366
      contrasts:
        - {name: Left, weights: [1, 0]}
        - {name: Right, weights: [0, 1]}
        - {name: Left_gt_Right, weights: [1, -1]}
        - {name: Right_gt_Left, weights: [-1, 1]}
        - {name: Left_plus_Right, weights: [1, 1]}
    post_stats:
      use_course_defaults: true

