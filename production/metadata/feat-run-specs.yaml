runs:
  sequence_pilot:
    dataset: ds005085
    subject: sub-10015
    task: sharedreward
    acquisition: mb3me1
    role: videos 2 through 12
    bold: /home/jovyan/Voxelwise-Walkthroughs/data/ds005085/sub-10015/func/sub-10015_task-sharedreward_acq-mb3me1_bold.nii.gz
    structural_brain: /home/jovyan/Voxelwise-Walkthroughs/data/ds005085/sub-10015/anat/sub-10015_T1w_bet.nii.gz
